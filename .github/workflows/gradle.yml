name: Java CI with Gradle

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout project
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: zulu

    - name: Build with Gradle
      run: ./gradlew build
